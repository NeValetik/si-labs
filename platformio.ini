; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
monitor_speed = 9600
monitor_port = COM3
monitor_echo = yes
monitor_eol = CRLF
lib_ldf_mode = deep
lib_deps = arduino-libraries/LiquidCrystal @ ^1.0.7

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_speed = 115200
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
monitor_echo = ${common.monitor_echo}
monitor_eol = ${common.monitor_eol}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps = 
	${common.lib_deps}
	arduino-libraries/Servo@^1.3.0
	feilipu/FreeRTOS@^11.1.0-3
	fmalpartida/LiquidCrystal@^1.5.0
build_flags = 
	-Wno-error=unused-variable
	-D F_CPU=16000000L
	-D ACTIVE_LAB=3
build_src_filter = +<*> -<labs/lab4/> -<labs/lab5/> -<labs/lab6/> -<labs/lab7/> -<labs/lab8/> -<labs/lab9/> -<labs/lab10/>

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_speed = 115200
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
monitor_echo = ${common.monitor_echo}
monitor_eol = ${common.monitor_eol}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps = 
	${common.lib_deps}
	arduino-libraries/Servo@^1.3.0
	feilipu/FreeRTOS@^10.5.1-1
	fmalpartida/LiquidCrystal@^1.5.0
build_flags = 
	-Wno-error=unused-variable
	-D F_CPU=16000000L
	-D USE_FREERTOS
	-D ACTIVE_LAB=4

